name: visual-regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build app
        run: npm run build
      - name: Start preview
        run: |
          npx vite preview --port 8080 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 > /dev/null && break || sleep 2
          done
      - name: Run visual regression suite
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: npx playwright test e2e/visual-regression.spec.ts --project=chromium
      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            test-results/
            e2e/visual-regression.spec.ts-snapshots/
          retention-days: 14
      - name: Summary
        if: always()
        run: |
          echo "### Visual regression" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ No visual diffs, no header duplicates, no overlapping CTAs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Visual diff or DOM overlap detected — see uploaded artifacts." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Update baselines locally with: \`npx playwright test e2e/visual-regression.spec.ts --update-snapshots\`" >> "$GITHUB_STEP_SUMMARY"
          fi
