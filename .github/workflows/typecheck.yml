name: typecheck

# Vérification principale sur chaque push/PR : installation figée, typage
# réel, tests unitaires, build de production.
#
# Causes du rouge historique :
#  - `npm ci` échouait (ERESOLVE) : package-lock.json n'était plus maintenu
#    (lenis et web-vitals absents) ; le lockfile réellement tenu à jour par
#    Lovable est bun.lock → installation via `bun install --frozen-lockfile`.
#  - `npx tsc --noEmit` ne vérifiait RIEN : tsconfig.json racine a
#    `files: []` + références (il faudrait `tsc -b`). On vérifie donc
#    explicitement chaque projet (app, outillage Node, e2e).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tsc:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      # Valeurs factices (aucun secret) : le build ne doit dépendre d'aucun
      # backend réel ; elles priment sur le .env versionné.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: cle-factice-ci
      VITE_SUPABASE_PROJECT_ID: projet-factice-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Installation figée (bun.lock)
        run: bun install --frozen-lockfile
      - name: TypeScript — application (src)
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: TypeScript — configs Vite/Vitest
        run: npx tsc -p tsconfig.node.json --noEmit
      - name: TypeScript — specs e2e Playwright
        run: npx tsc -p tsconfig.e2e.json --noEmit
      - name: Tests unitaires (vitest)
        run: npm test
      - name: Vite build (prebuild i18n inclus)
        run: npm run build
