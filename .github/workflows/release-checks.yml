name: release-checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `npm ci || npm install` échouait des deux côtés (ERESOLVE, lockfile npm
      # désynchronisé) : installation figée depuis bun.lock.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Version + CHANGELOG/README consistency
        run: npm run check:release
      - name: Non-overpromise content check
        run: npm run check:overpromise
      - name: i18n CI
        run: npm run i18n:ci
      - name: Summary
        if: always()
        run: |
          echo "### Release pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **check:release passed** — CHANGELOG.md, README.md and src/lib/appVersion.ts agree." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **check:release FAILED** — fix version stamps before publishing." >> "$GITHUB_STEP_SUMMARY"
          fi
