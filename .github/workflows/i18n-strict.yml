name: i18n strict check

on:
  pull_request:
    paths:
      - "src/i18n/**"
      - "src/**/*.tsx"
      - "src/**/*.ts"
      - "scripts/i18n-strict-check.mjs"
      - "scripts/i18n-qa-report.mjs"
      - "src/generated/changelog.json"
  push:
    branches: [main]

jobs:
  i18n-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build changelog (input for strict check)
        run: node scripts/build-changelog.mjs
      - name: Run i18n strict check
        run: node scripts/i18n-strict-check.mjs
