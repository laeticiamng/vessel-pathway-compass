name: i18n contract check

on:
  pull_request:
    paths:
      - "src/i18n/**"
      - "src/**/*.tsx"
      - "scripts/i18n-ci-check.mjs"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "src/i18n/**"

jobs:
  i18n-check:
    name: Validate i18n structures (FR/EN/DE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # bun.lock est le lockfile maintenu (package-lock.json était désynchronisé
      # et faisait échouer `npm ci`).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run i18n CI check
        run: npm run i18n:ci
