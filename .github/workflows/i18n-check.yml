name: i18n contract check

on:
  pull_request:
    paths:
      - "src/i18n/**"
      - "src/**/*.tsx"
      - "scripts/i18n-ci-check.mjs"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "src/i18n/**"

jobs:
  i18n-check:
    name: Validate i18n structures (FR/EN/DE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Run i18n CI check
        run: npm run i18n:ci
