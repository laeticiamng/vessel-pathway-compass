<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gDiag" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#E8F3EE"/><stop offset="100%" stop-color="#CFE6D9"/>
    </linearGradient>
    <linearGradient id="gGuide" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFF6E8"/><stop offset="100%" stop-color="#F5E0BF"/>
    </linearGradient>
    <linearGradient id="gPre" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FBE5E5"/><stop offset="100%" stop-color="#F1C7C7"/>
    </linearGradient>
    <linearGradient id="gValid" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#EAF0FB"/><stop offset="100%" stop-color="#CCD9F0"/>
    </linearGradient>
    <linearGradient id="gEndpoint" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0F4C81"/><stop offset="100%" stop-color="#0A3A66"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <polygon points="0 0, 14 7, 0 14" fill="#0F4C81"/>
    </marker>
    <marker id="arrowFail" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <polygon points="0 0, 14 7, 0 14" fill="#B23A3A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="42" text-anchor="middle" font-size="28" font-weight="bold" fill="#0F4C81">VASCU-LINK — Du diagnostic à la preuve clinique</text>
  <text x="800" y="68" text-anchor="middle" font-size="15" font-style="italic" fill="#555">Architecture cercles concentriques · Endpoints verrouillés · Comparateurs explicites · Bascule sécurité documentée</text>

  <!-- 4-zero header -->
  <rect x="40" y="86" width="1520" height="42" fill="#1F8A70" rx="6"/>
  <text x="800" y="113" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Cockpit vasculaire 4-zéro · 0 mSv · 0 Gd / 0 iode · 0 hélium · BoM cible &lt; 15 k€ · matériaux recyclés/biosourcés</text>

  <!-- ========== L1 DIAGNOSE ========== -->
  <rect x="40" y="148" width="1520" height="200" fill="url(#gDiag)" stroke="#1F8A70" stroke-width="2.5" rx="10"/>
  <text x="60" y="178" font-size="19" font-weight="bold" fill="#1F8A70">L1 — DIAGNOSE</text>
  <text x="60" y="200" font-size="12" fill="#555">Cercle 1 — Noyau PhD obligatoire · Cohorte prospective CHUV/Lausanne (n ≈ 250 analysables, 320 inclus, dropout 25–30 %)</text>

  <g font-size="12" fill="#1F8A70" text-anchor="middle">
    <rect x="70" y="218" width="350" height="58" fill="#fff" stroke="#1F8A70" stroke-width="1.4" rx="6"/>
    <text x="245" y="242" font-weight="bold">ARM bas champ AquaMR</text>
    <text x="245" y="262" font-size="11" fill="#555">Halbach NdFeB recyclés + reconstruction IA</text>

    <rect x="438" y="218" width="350" height="58" fill="#fff" stroke="#1F8A70" stroke-width="1.4" rx="6"/>
    <text x="613" y="242" font-weight="bold">Écho-Doppler structuré</text>
    <text x="613" y="262" font-size="11" fill="#555">+ ABI / TBI / oxymétrie connectée</text>

    <rect x="806" y="218" width="350" height="58" fill="#fff" stroke="#1F8A70" stroke-width="1.4" rx="6"/>
    <text x="981" y="242" font-weight="bold">Stratification C4-i</text>
    <text x="981" y="262" font-size="11" fill="#555">Discordance clinico-physiologique (v11.1)</text>

    <rect x="1174" y="218" width="356" height="58" fill="#fff" stroke="#1F8A70" stroke-width="1.4" rx="6"/>
    <text x="1352" y="242" font-weight="bold">PROMs vasculaires</text>
    <text x="1352" y="262" font-size="11" fill="#555">WIQ · VascuQol-6 · 6-MWT · M0/M6/M12/M24/M48</text>
  </g>

  <text x="800" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F8A70">Sortie L1 : patient lisible, classable, orientable → décision pré-revascularisation traçable</text>
  <text x="800" y="320" text-anchor="middle" font-size="11" fill="#555">Abstention · médical optimisé · surveillance · imagerie complémentaire · endovasculaire · chirurgical</text>
  <text x="800" y="338" text-anchor="middle" font-size="11" font-style="italic" fill="#555">Si qualité d'image insuffisante → bascule documentée (cf. bloc Sécurité &amp; Bascule ci-dessous)</text>

  <!-- ========== ENDPOINT BLOCK (NEW) ========== -->
  <rect x="40" y="368" width="1000" height="200" fill="url(#gEndpoint)" stroke="#062847" stroke-width="2.5" rx="10"/>
  <text x="60" y="398" font-size="18" font-weight="bold" fill="#fff">ENDPOINTS — verrouillés</text>
  <text x="60" y="420" font-size="11" fill="#CFD8E5">Hiérarchie pré-spécifiée · α = 0,05 bilatéral · ajustement Bonferroni-Holm sur sous-groupes</text>

  <g font-size="12" fill="#fff">
    <rect x="60" y="432" width="240" height="118" fill="rgba(255,255,255,0.08)" stroke="#fff" stroke-width="1" rx="6"/>
    <text x="180" y="454" text-anchor="middle" font-weight="bold" fill="#FFD86B">PRIMAIRE</text>
    <text x="180" y="474" text-anchor="middle" font-size="11">Concordance segmentaire</text>
    <text x="180" y="490" text-anchor="middle" font-size="11">AquaMR vs angio-CT</text>
    <text x="180" y="510" text-anchor="middle" font-size="11" font-weight="bold">κ Cohen ≥ 0,75</text>
    <text x="180" y="528" text-anchor="middle" font-size="10" fill="#CFD8E5">Sténose ≥ 50 % · 18 segments</text>
    <text x="180" y="544" text-anchor="middle" font-size="10" fill="#CFD8E5">Se ≥ 85 % · Sp ≥ 90 %</text>

    <rect x="320" y="432" width="240" height="118" fill="rgba(255,255,255,0.08)" stroke="#fff" stroke-width="1" rx="6"/>
    <text x="440" y="454" text-anchor="middle" font-weight="bold" fill="#FFD86B">SECONDAIRE MAJEUR</text>
    <text x="440" y="474" text-anchor="middle" font-size="11">Impact décision</text>
    <text x="440" y="490" text-anchor="middle" font-size="11">pré-revascularisation</text>
    <text x="440" y="510" text-anchor="middle" font-size="11" font-weight="bold">Δ stratégie ≥ 15 %</text>
    <text x="440" y="528" text-anchor="middle" font-size="10" fill="#CFD8E5">Pré- vs post-AquaMR</text>
    <text x="440" y="544" text-anchor="middle" font-size="10" fill="#CFD8E5">Adjudication aveugle (DSMB)</text>

    <rect x="580" y="432" width="220" height="118" fill="rgba(255,255,255,0.08)" stroke="#fff" stroke-width="1" rx="6"/>
    <text x="690" y="454" text-anchor="middle" font-weight="bold" fill="#FFD86B">PROMs / SÉCURITÉ</text>
    <text x="690" y="474" text-anchor="middle" font-size="11">WIQ, VascuQol-6, 6-MWT</text>
    <text x="690" y="490" text-anchor="middle" font-size="11">CI-AKI J7 / J30</text>
    <text x="690" y="510" text-anchor="middle" font-size="11" font-weight="bold">Δ score &amp; AE rate</text>
    <text x="690" y="528" text-anchor="middle" font-size="10" fill="#CFD8E5">Suivi M0–M48</text>

    <rect x="820" y="432" width="200" height="118" fill="rgba(255,255,255,0.08)" stroke="#fff" stroke-width="1" rx="6"/>
    <text x="920" y="454" text-anchor="middle" font-weight="bold" fill="#FFD86B">SOUS-GROUPES</text>
    <text x="920" y="474" text-anchor="middle" font-size="11">Pré-spécifiés</text>
    <text x="920" y="492" text-anchor="middle" font-size="11">· Sexe (Lanzi/Mazzolai)</text>
    <text x="920" y="508" text-anchor="middle" font-size="11">· IRC stade ≥ 3</text>
    <text x="920" y="524" text-anchor="middle" font-size="11">· C4-i discordance haute</text>
    <text x="920" y="544" text-anchor="middle" font-size="10" fill="#CFD8E5">Bonferroni-Holm</text>
  </g>

  <!-- ========== COMPARATOR BLOCK (NEW) ========== -->
  <rect x="1060" y="368" width="500" height="200" fill="url(#gValid)" stroke="#0F4C81" stroke-width="2.5" rx="10"/>
  <text x="1080" y="398" font-size="18" font-weight="bold" fill="#0F4C81">COMPARATEURS — explicites</text>
  <text x="1080" y="418" font-size="11" fill="#555">Référence anatomique &amp; cliniques verrouillées avant inclusion</text>

  <g font-size="12">
    <rect x="1080" y="430" width="460" height="32" fill="#fff" stroke="#0F4C81" stroke-width="1" rx="4"/>
    <text x="1095" y="451" font-weight="bold" fill="#0F4C81">Angio-CT</text>
    <text x="1230" y="451" fill="#555">→ Gold standard anatomique (référence primaire)</text>

    <rect x="1080" y="468" width="460" height="32" fill="#fff" stroke="#0F4C81" stroke-width="1" rx="4"/>
    <text x="1095" y="489" font-weight="bold" fill="#0F4C81">Écho-Doppler</text>
    <text x="1230" y="489" fill="#555">→ Standard clinique de première ligne (hémodynamique)</text>

    <rect x="1080" y="506" width="460" height="32" fill="#fff" stroke="#0F4C81" stroke-width="1" rx="4"/>
    <text x="1095" y="527" font-weight="bold" fill="#0F4C81">ARM Gd 1,5–3 T</text>
    <text x="1230" y="527" fill="#555">→ Alternative non irradiante (sous-cohorte si dispo)</text>

    <rect x="1080" y="544" width="460" height="20" fill="#fff" stroke="#0F4C81" stroke-width="1" rx="4"/>
    <text x="1310" y="558" text-anchor="middle" font-style="italic" font-size="11" fill="#555">Lecture core lab aveugle · 2 lecteurs indépendants + adjudication</text>
  </g>

  <!-- ========== DECISION COCKPIT ========== -->
  <rect x="280" y="600" width="1040" height="100" fill="#0F4C81" rx="10"/>
  <text x="800" y="632" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">DÉCISION — Cockpit AquaMR Flow</text>
  <text x="800" y="654" text-anchor="middle" font-size="12" fill="#CFE6F0">Jumeau vasculaire patient-spécifique · Fusion multimodale · Registre AquaMR · 15 ADR documentés</text>
  <text x="800" y="674" text-anchor="middle" font-size="11" font-style="italic" fill="#CFE6F0">Architecture conçue pour viser MDR/RGPD/IEC 62304 (non certifiée à ce stade) · DSMB &amp; Data Access Committee indépendants</text>
  <text x="800" y="691" text-anchor="middle" font-size="11" font-style="italic" fill="#CFE6F0">Migration prévue HDS UE/CH · Replay temporel · Compliance score A→E</text>

  <!-- arrows -->
  <line x1="540" y1="570" x2="540" y2="600" stroke="#0F4C81" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="700" x2="800" y2="730" stroke="#0F4C81" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ========== VALIDATION CLINIQUE BLOCK (NEW) ========== -->
  <rect x="40" y="730" width="1000" height="160" fill="url(#gValid)" stroke="#0F4C81" stroke-width="2.5" rx="10"/>
  <text x="60" y="760" font-size="18" font-weight="bold" fill="#0F4C81">VALIDATION CLINIQUE — plan de preuve</text>
  <text x="60" y="780" font-size="11" fill="#555">Calcul de puissance pré-spécifié · Analyse ITT principale + Per-Protocol sensibilité · SAP figé avant déverrouillage base</text>

  <g font-size="11" fill="#0F4C81">
    <rect x="60" y="794" width="232" height="80" fill="#fff" stroke="#0F4C81" stroke-width="1" rx="6"/>
    <text x="176" y="814" text-anchor="middle" font-weight="bold">Sensibilité / Spécificité</text>
    <text x="176" y="834" text-anchor="middle" font-size="10" fill="#555">vs angio-CT · seuil 50 %</text>
    <text x="176" y="850" text-anchor="middle" font-size="10" fill="#555">IC 95 % exact (Clopper-Pearson)</text>
    <text x="176" y="866" text-anchor="middle" font-size="10" fill="#555">Cible Se ≥ 85 % · Sp ≥ 90 %</text>

    <rect x="304" y="794" width="232" height="80" fill="#fff" stroke="#0F4C81" stroke-width="1" rx="6"/>
    <text x="420" y="814" text-anchor="middle" font-weight="bold">Concordance κ &amp; AUC</text>
    <text x="420" y="834" text-anchor="middle" font-size="10" fill="#555">κ Cohen pondéré · 18 segments</text>
    <text x="420" y="850" text-anchor="middle" font-size="10" fill="#555">ROC par territoire</text>
    <text x="420" y="866" text-anchor="middle" font-size="10" fill="#555">Cible κ ≥ 0,75 (substantiel)</text>

    <rect x="548" y="794" width="232" height="80" fill="#fff" stroke="#0F4C81" stroke-width="1" rx="6"/>
    <text x="664" y="814" text-anchor="middle" font-weight="bold">Impact thérapeutique</text>
    <text x="664" y="834" text-anchor="middle" font-size="10" fill="#555">Reclassement décisionnel</text>
    <text x="664" y="850" text-anchor="middle" font-size="10" fill="#555">NRI / IDI vs stratégie standard</text>
    <text x="664" y="866" text-anchor="middle" font-size="10" fill="#555">Cible Δ ≥ 15 %</text>

    <rect x="792" y="794" width="236" height="80" fill="#fff" stroke="#0F4C81" stroke-width="1" rx="6"/>
    <text x="910" y="814" text-anchor="middle" font-weight="bold">Reproductibilité</text>
    <text x="910" y="834" text-anchor="middle" font-size="10" fill="#555">Inter- &amp; intra-opérateur</text>
    <text x="910" y="850" text-anchor="middle" font-size="10" fill="#555">ICC + Bland-Altman</text>
    <text x="910" y="866" text-anchor="middle" font-size="10" fill="#555">Cible ICC ≥ 0,80</text>
  </g>

  <!-- ========== SAFETY / SWITCH BLOCK (NEW) ========== -->
  <rect x="1060" y="730" width="500" height="160" fill="#FBEEEE" stroke="#B23A3A" stroke-width="2.5" rx="10"/>
  <text x="1080" y="760" font-size="18" font-weight="bold" fill="#B23A3A">SÉCURITÉ &amp; BASCULE</text>
  <text x="1080" y="780" font-size="11" fill="#555">Algorithme décisionnel pré-spécifié · tracé dans le cockpit</text>

  <g font-size="11" fill="#7A2828">
    <rect x="1080" y="794" width="460" height="22" fill="#fff" stroke="#B23A3A" stroke-width="1" rx="4"/>
    <text x="1095" y="809">① SNR &lt; seuil OU artefact non corrigible →</text>
    <text x="1530" y="809" text-anchor="end" font-weight="bold">bascule ARM Gd / angio-CT</text>

    <rect x="1080" y="820" width="460" height="22" fill="#fff" stroke="#B23A3A" stroke-width="1" rx="4"/>
    <text x="1095" y="835">② Discordance C4-i &gt; seuil critique →</text>
    <text x="1530" y="835" text-anchor="end" font-weight="bold">imagerie complémentaire</text>

    <rect x="1080" y="846" width="460" height="22" fill="#fff" stroke="#B23A3A" stroke-width="1" rx="4"/>
    <text x="1095" y="861">③ Ischémie aiguë / critique →</text>
    <text x="1530" y="861" text-anchor="end" font-weight="bold">geste immédiat hospitalier</text>

    <rect x="1080" y="872" width="460" height="14" fill="none"/>
    <text x="1310" y="884" text-anchor="middle" font-size="10" font-style="italic" fill="#555">Toute bascule horodatée + journalisée + adjudiquée par DSMB</text>
  </g>

  <!-- ========== L2 GUIDE ========== -->
  <line x1="800" y1="890" x2="800" y2="918" stroke="#0F4C81" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="40" y="918" width="1520" height="130" fill="url(#gGuide)" stroke="#C97B2B" stroke-width="2.5" rx="10"/>
  <text x="60" y="948" font-size="19" font-weight="bold" fill="#C97B2B">L2 — GUIDE</text>
  <text x="60" y="970" font-size="12" fill="#555">Cercle 2 — Extension PhD conditionnelle · Démonstration sur fantôme / modèle simulé · Acceptabilité &amp; utilisabilité mesurées (SUS, NASA-TLX)</text>

  <g font-size="12" fill="#C97B2B" text-anchor="middle">
    <rect x="70" y="985" width="470" height="50" fill="#fff" stroke="#C97B2B" stroke-width="1.4" rx="6"/>
    <text x="305" y="1015" font-weight="bold">Fusion temps réel écho-MR</text>

    <rect x="558" y="985" width="470" height="50" fill="#fff" stroke="#C97B2B" stroke-width="1.4" rx="6"/>
    <text x="793" y="1015" font-weight="bold">Tracking instrument MR-safe</text>

    <rect x="1046" y="985" width="484" height="50" fill="#fff" stroke="#C97B2B" stroke-width="1.4" rx="6"/>
    <text x="1288" y="1015" font-weight="bold">Ponction guidée — fantôme / simulé</text>
  </g>

  <!-- ========== L3 PRECLINICAL ========== -->
  <line x1="800" y1="1048" x2="800" y2="1076" stroke="#0F4C81" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="40" y="1076" width="1520" height="80" fill="url(#gPre)" stroke="#B23A3A" stroke-width="2.5" rx="10"/>
  <text x="60" y="1106" font-size="19" font-weight="bold" fill="#B23A3A">L3 — VISION POST-PHD (préclinique)</text>
  <text x="60" y="1128" font-size="12" fill="#555">Cercle 3 — PoC interventionnel STRICTEMENT préclinique (modèle animal/cadavre) · Aucune application humaine dans le cadre de la thèse</text>
  <text x="60" y="1146" font-size="11" font-style="italic" fill="#555">Pré-soumission organisme notifié (hypothèse IIa / scénario IIb anticipé) · LOI LMIC sous condition jalons</text>

  <!-- Footer -->
  <text x="800" y="1190" text-anchor="middle" font-size="11" fill="#555">5 jalons Go/No-Go : J1 (M9) BoM &amp; signal RMN · J2 (M21) contraste flux/statique · J3 (M36) concordance + sous-groupes · J4 (M42) ponction fantôme · J5 (M48) PoC L3 + pré-soumission</text>
  <text x="800" y="1212" text-anchor="middle" font-size="11" font-style="italic" fill="#0F4C81">Candidate Dr Laëticia Motongane (GLN 7601009569944) · Direction proposée Pr Lucia Mazzolai · CHUV/Lausanne · Avril 2026</text>
  <text x="800" y="1240" text-anchor="middle" font-size="10" fill="#888">VASCU-LINK schema v8 — proof-grade · ce diagramme expose comment le projet prouve, pas seulement comment il fonctionne</text>
</svg>
